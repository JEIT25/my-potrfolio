  <text x="100" y="340" font-family="'Georgia', serif" font-size="42" font-weight="bold" fill="#18181b">Jerold Micarandayo Amora</text>
  <text x="100" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#71717a">has successfully completed</text>

