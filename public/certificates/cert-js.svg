<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#ffffff"/>
  
  <!-- Outer double border frame -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#71717a" stroke-width="2"/>
  <rect x="26" y="26" width="948" height="648" fill="none" stroke="#a1a1aa" stroke-width="1"/>

  <!-- Right Ribbon / Badge Column -->
  <rect x="660" y="20" width="230" height="660" fill="#f4f4f5"/>
  <polygon points="660,680 775,640 890,680 890,20 660,20" fill="#e4e4e7"/>
  
  <text x="775" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#27272a" text-anchor="middle" letter-spacing="3">COURSE</text>
  <text x="775" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#27272a" text-anchor="middle" letter-spacing="3">CERTIFICATE</text>

