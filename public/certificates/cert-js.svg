  <text x="775" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800" fill="#0056D2" text-anchor="middle">coursera</text>
  <text x="775" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#52525b" text-anchor="middle" letter-spacing="2">VERIFIED RECORD</text>

  <!-- Meta Logo Left -->
  <path d="M120 150 C120 135, 135 135, 145 150 L170 185 C180 200, 195 200, 205 185 L230 150 C240 135, 255 135, 255 150 C255 165, 240 165, 230 150 L205 115 C195 100, 180 100, 170 115 L145 150 C135 165, 120 165, 120 150 Z" fill="#0064e0"/>
  <text x="215" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800" fill="#1c2b33">Meta</text>

