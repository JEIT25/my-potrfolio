<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <rect width="1000" height="700" fill="#ffffff"/>
  
  <!-- Outer double border frame -->
  <rect x="20" y="20" width="960" height="660" fill="none" stroke="#15803d" stroke-width="3"/>
  <rect x="26" y="26" width="948" height="648" fill="none" stroke="#22c55e" stroke-width="1"/>

  <!-- Right Ribbon / Badge Column -->
  <rect x="660" y="20" width="230" height="660" fill="#f0fdf4"/>
  <polygon points="660,680 775,640 890,680 890,20 660,20" fill="#dcfce7"/>
  
  <text x="775" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#14532d" text-anchor="middle" letter-spacing="3">NATIONAL</text>
  <text x="775" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="bold" fill="#14532d" text-anchor="middle" letter-spacing="3">CERTIFICATE</text>

  <!-- TESDA Emblem Circle -->
  <circle cx="775" cy="490" r="85" fill="none" stroke="#15803d" stroke-width="3"/>
  <circle cx="775" cy="490" r="77" fill="none" stroke="#15803d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="775" y="480" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#15803d" text-anchor="middle">TESDA</text>
  <text x="775" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle" letter-spacing="2">NC II CERTIFIED</text>

